pluginManagement {
    repositories {
        google()
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}
dependencyResolutionManagement {
    //repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        mavenLocal()
        //maven { url 'https://sonatype.org' }

        maven {
            url 'https://raw.githubusercontent.com/DFKI-MLT/Maven-Repository/main'
            content {
                includeGroup 'de.dfki.lt.jtok'
                includeGroup 'de.dfki.mary'
            }
        }
        maven {
            url = uri("https://openhab.jfrog.io/openhab/libs-release/")
            content {
                includeGroup("gov.nist.math")
            }
        }

        maven {
            url = uri("https://maven-ext.dev.bookmap.com/")
            content {
                includeGroup("com.twmacinta")
            }
        }
    }
}
rootProject.name = "NepoBaby"
include ':desktop'

include ':game'